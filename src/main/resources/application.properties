spring.config.import=optional:file:./application-local.properties

server.port=${SERVER_PORT:8080}
server.servlet.context-path=${APP_CONTEXT_PATH:/libraryManager}
server.servlet.session.timeout=30m
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.datasource.url=${LIBRARY_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=LibraryManager_V2;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${LIBRARY_DB_USERNAME:sa}
spring.datasource.password=${LIBRARY_DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=${LIBRARY_DB_DDL_AUTO:validate}
spring.jpa.show-sql=${LIBRARY_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Email configuration (Optional - for Forgot Password)
spring.mail.host=${MAIL_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_SMTP_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

# Google OAuth2 configuration
app.security.oauth2.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
app.security.oauth2.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}

app.mail.from-name=${MAIL_FROM_NAME:Library Manager}
app.mail.from-email=${MAIL_FROM_EMAIL:}
app.borrow-reminders.enabled=${BORROW_REMINDERS_ENABLED:true}
app.borrow-reminders.cron=${BORROW_REMINDERS_CRON:0 0 7 * * *}
app.groq.enabled=${GROQ_ENABLED:true}
app.groq.api-key=${GROQ_API_KEY:}
app.groq.model=${GROQ_MODEL:llama-3.1-8b-instant}
app.groq.temperature=${GROQ_TEMPERATURE:0.4}
app.groq.max-completion-tokens=${GROQ_MAX_COMPLETION_TOKENS:700}
app.groq.connect-timeout-ms=${GROQ_CONNECT_TIMEOUT_MS:5000}
app.groq.read-timeout-ms=${GROQ_READ_TIMEOUT_MS:30000}
app.upload.root-dir=${APP_UPLOAD_ROOT_DIR:uploads}

logging.level.com.library=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
