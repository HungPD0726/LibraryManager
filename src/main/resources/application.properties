server.port=${SERVER_PORT:8080}
server.servlet.context-path=${APP_CONTEXT_PATH:/libraryManager}
server.servlet.session.timeout=30m
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.datasource.url=${LIBRARY_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=LibraryManager_V2;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${LIBRARY_DB_USERNAME:sa}
spring.datasource.password=${LIBRARY_DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=${LIBRARY_DB_DDL_AUTO:update}
spring.jpa.show-sql=${LIBRARY_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Email configuration (Optional - for Forgot Password)
spring.mail.host=${MAIL_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_SMTP_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

# Google OAuth2 configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

app.mail.from-name=${MAIL_FROM_NAME:Library Manager}
app.mail.from-email=${MAIL_FROM_EMAIL:}
app.groq.enabled=${GROQ_ENABLED:true}
app.groq.api-key=${GROQ_API_KEY:}
app.groq.model=${GROQ_MODEL:llama-3.1-8b-instant}
app.groq.temperature=${GROQ_TEMPERATURE:0.4}
app.groq.max-completion-tokens=${GROQ_MAX_COMPLETION_TOKENS:700}
app.groq.connect-timeout-ms=${GROQ_CONNECT_TIMEOUT_MS:5000}
app.groq.read-timeout-ms=${GROQ_READ_TIMEOUT_MS:30000}
app.upload.root-dir=${APP_UPLOAD_ROOT_DIR:uploads}

logging.level.com.library=${APP_LOG_LEVEL:DEBUG}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
