<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/auth}">
<head>
    <title>Đăng nhập</title>
</head>
<body>
<section layout:fragment="content">
    <div class="login-shell">
        <div class="login-form-surface">
            <div class="login-heading">
                <p class="eyebrow">Đăng nhập</p>
                <h2 class="login-title">Chào mừng bạn quay lại</h2>
                <p class="login-subtitle">Theo dõi mượn trả, đơn mua và Library AI trong một không gian học tập gọn gàng hơn.</p>
            </div>

            <form th:action="@{/login}" method="post" class="stack-form login-form">
                <label class="field">
                    <span>Tài khoản hoặc email</span>
                    <div class="input-with-icon">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" name="username" placeholder="Nhập tên đăng nhập hoặc email" autofocus required>
                    </div>
                </label>

                <label class="field">
                    <span>Mật khẩu</span>
                    <div class="input-with-icon has-action">
                        <i class="fa-solid fa-lock"></i>
                        <input id="loginPassword" type="password" name="password" placeholder="Nhập mật khẩu" required>
                        <button type="button"
                                class="input-action"
                                data-toggle-password="#loginPassword"
                                aria-label="Hiện hoặc ẩn mật khẩu">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </label>

                <div class="login-submit-row">
                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fa-solid fa-arrow-right-to-bracket"></i>
                        Đăng nhập
                    </button>
                </div>

                <div class="login-divider">
                    <span>Hoặc đăng nhập với</span>
                </div>

                <div class="social-login-row">
                    <a th:href="@{/oauth2/authorization/google}" class="btn btn-outline btn-block social-btn google-btn">
                        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google icon" width="18">
                        Google
                    </a>
                </div>
            </form>

            <div class="inline-links login-links login-links-row">
                <a th:href="@{/forgot-password}">Quên mật khẩu?</a>
                <a th:href="@{/register}">Tạo tài khoản mới</a>
            </div>
        </div>
    </div>
</section>
</body>
</html>
