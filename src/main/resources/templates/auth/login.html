<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/auth}">
<head>
    <title>Đăng nhập</title>
</head>
<body>
<section layout:fragment="content">
    <div class="section-heading">
        <p class="eyebrow">Đăng nhập</p>
        <h2>Truy cập hệ thống thư viện</h2>
        <p>Dùng tên đăng nhập hoặc email đã đăng ký.</p>
    </div>

    <form th:action="@{/login}" method="post" class="stack-form">
        <label class="field">
            <span>Tài khoản hoặc email</span>
            <input type="text" name="username" placeholder="student01 hoặc student01@example.com" autofocus>
        </label>

        <label class="field">
            <span>Mật khẩu</span>
            <input type="password" name="password" placeholder="Nhập mật khẩu">
        </label>

        <button type="submit" class="btn btn-primary btn-block">
            <i class="fa-solid fa-arrow-right-to-bracket"></i>
            Đăng nhập
        </button>
    </form>

    <div class="inline-links">
        <a th:href="@{/forgot-password}">Quên mật khẩu</a>
        <a th:href="@{/register}">Tạo tài khoản sinh viên</a>
    </div>
</section>
</body>
</html>
