<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/auth}">
<head>
    <title>Đặt lại mật khẩu</title>
</head>
<body>
<section layout:fragment="content">
    <div class="auth-flow-shell">
        <div class="section-heading">
            <p class="eyebrow">Bước 3</p>
            <h2>Đặt mật khẩu mới</h2>
            <p>Mật khẩu mới sẽ được lưu bằng encoder mới nhưng vẫn tương thích đăng nhập cũ.</p>
        </div>

        <form th:action="@{/reset-password}" th:object="${form}" method="post" class="stack-form auth-form-stack">
            <label class="field">
                <span>Mật khẩu mới</span>
                <input type="password" th:field="*{password}">
                <small class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>
            </label>
            <label class="field">
                <span>Xác nhận mật khẩu mới</span>
                <input type="password" th:field="*{confirmPassword}">
                <small class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></small>
            </label>

            <div class="auth-check-list">
                <span class="status-pill secondary"><i class="fa-solid fa-key"></i> Chọn mật khẩu dễ nhớ nhưng khó đoán</span>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                <i class="fa-solid fa-key"></i>
                Cập nhật mật khẩu
            </button>
        </form>
    </div>
</section>
</body>
</html>
