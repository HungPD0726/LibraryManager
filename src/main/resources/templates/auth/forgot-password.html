<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/auth}">
<head>
    <title>Quên mật khẩu</title>
</head>
<body>
<section layout:fragment="content">
    <div class="auth-flow-shell">
        <div class="section-heading">
            <p class="eyebrow">Khôi phục mật khẩu</p>
            <h2>Gửi OTP về email đăng ký</h2>
            <p>Nhập email hoặc tên đăng nhập để bắt đầu quá trình khôi phục trong vài bước ngắn gọn.</p>
        </div>

        <form th:action="@{/forgot-password}" th:object="${form}" method="post" class="stack-form auth-form-stack">
            <label class="field">
                <span>Email hoặc tên đăng nhập</span>
                <input type="text" th:field="*{identity}" placeholder="student01 hoặc student01@example.com">
                <small class="field-error" th:if="${#fields.hasErrors('identity')}" th:errors="*{identity}"></small>
            </label>

            <div class="auth-check-list">
                <span class="status-pill secondary"><i class="fa-solid fa-clock-rotate-left"></i> OTP chỉ dùng trong thời gian ngắn</span>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                <i class="fa-solid fa-paper-plane"></i>
                Gửi OTP
            </button>
        </form>

        <div class="inline-links auth-flow-footer">
            <a th:href="@{/login}">Quay lại đăng nhập</a>
        </div>
    </div>
</section>
</body>
</html>
