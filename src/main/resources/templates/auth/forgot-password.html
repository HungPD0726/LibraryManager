<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/auth}">
<head>
    <title>Quên mật khẩu</title>
</head>
<body>
<section layout:fragment="content">
    <div class="section-heading">
        <p class="eyebrow">Khôi phục mật khẩu</p>
        <h2>Gửi OTP về email đăng ký</h2>
        <p>Nhập email hoặc tên đăng nhập để bắt đầu.</p>
    </div>

    <form th:action="@{/forgot-password}" th:object="${form}" method="post" class="stack-form">
        <label class="field">
            <span>Email hoặc tên đăng nhập</span>
            <input type="text" th:field="*{identity}" placeholder="student01 hoặc student01@example.com">
            <small class="field-error" th:if="${#fields.hasErrors('identity')}" th:errors="*{identity}"></small>
        </label>
        <button type="submit" class="btn btn-primary btn-block">
            <i class="fa-solid fa-paper-plane"></i>
            Gửi OTP
        </button>
    </form>

    <div class="inline-links">
        <a th:href="@{/login}">Quay lại đăng nhập</a>
    </div>
</section>
</body>
</html>
