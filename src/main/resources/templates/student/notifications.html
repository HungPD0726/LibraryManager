<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/student}">
<head>
    <title>Thông báo</title>
</head>
<body>
<section layout:fragment="content">
    <div class="page-head">
        <div>
            <p class="eyebrow">Thông báo</p>
            <h2>Hộp thông báo của bạn
                <span th:if="${unreadCount > 0}" class="status-pill danger" style="font-size: 0.75rem; vertical-align: middle;"
                      th:text="${unreadCount} + ' chưa đọc'">0 chưa đọc</span>
            </h2>
        </div>
        <form th:if="${unreadCount > 0}" th:action="@{/notifications/read-all}" method="post">
            <button type="submit" class="btn btn-outline">
                <i class="fa-solid fa-check-double"></i>
                Đánh dấu tất cả đã đọc
            </button>
        </form>
    </div>

    <div class="stack-list">
        <article th:each="n : ${notifications}" class="inline-card"
                 th:classappend="${!n.isRead ? ' notification-unread' : ''}">
            <div style="flex: 1;">
                <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.25rem;">
                    <i th:switch="${n.type}" class="notification-icon">
                        <i th:case="'BORROW_APPROVED'" class="fa-solid fa-circle-check" style="color: var(--green-soft);"></i>
                        <i th:case="'BORROW_REJECTED'" class="fa-solid fa-circle-xmark" style="color: var(--rose-soft);"></i>
                        <i th:case="'BORROW_RETURNED'" class="fa-solid fa-arrow-rotate-left" style="color: var(--sea-soft);"></i>
                        <i th:case="'FINE_CREATED'" class="fa-solid fa-gavel" style="color: var(--warn-soft);"></i>
                        <i th:case="'FINE_PAID'" class="fa-solid fa-money-bill-wave" style="color: var(--green-soft);"></i>
                        <i th:case="'ORDER_DELIVERED'" class="fa-solid fa-truck" style="color: var(--teal-soft);"></i>
                        <i th:case="'ORDER_CANCELLED'" class="fa-solid fa-ban" style="color: var(--rose-soft);"></i>
                        <i th:case="*" class="fa-solid fa-bell" style="color: var(--gold-soft);"></i>
                    </i>
                    <strong th:text="${n.title}">Tiêu đề</strong>
                    <span th:if="${!n.isRead}" class="status-pill danger" style="font-size: 0.65rem;">Mới</span>
                </div>
                <p th:text="${n.message}" class="muted-text" style="margin: 0;">Nội dung thông báo</p>
                <small class="muted-text" th:text="${#temporals.format(n.createdDate, 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</small>
            </div>
            <form th:if="${!n.isRead}" th:action="@{'/notifications/' + ${n.notificationId} + '/read'}" method="post">
                <button type="submit" class="btn btn-ghost btn-sm" title="Đánh dấu đã đọc">
                    <i class="fa-solid fa-check"></i>
                </button>
            </form>
        </article>
    </div>

    <div class="empty-state" th:if="${#lists.isEmpty(notifications)}">
        <i class="fa-solid fa-bell-slash"></i>
        <p>Bạn chưa có thông báo nào.</p>
    </div>
</section>
</body>
</html>
