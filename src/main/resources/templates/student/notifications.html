<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/student}">
<head>
    <title>Thông báo</title>
</head>
<body>
<section layout:fragment="content">
    <div class="page-head">
        <div>
            <p class="eyebrow">Thông báo</p>
            <h2>Hộp thông báo của bạn
                <span th:if="${unreadCount > 0}" class="status-pill danger notification-summary-badge"
                      th:text="|${unreadCount} chưa đọc|">0 chưa đọc</span>
            </h2>
            <div class="page-head-meta">
                <span class="status-pill secondary" th:text="${#lists.size(notifications) + ' thông báo'}">0 thông báo</span>
            </div>
        </div>
        <form th:if="${unreadCount > 0}" th:action="@{/notifications/read-all}" method="post">
            <button type="submit" class="btn btn-outline">
                <i class="fa-solid fa-check-double"></i>
                Đánh dấu tất cả đã đọc
            </button>
        </form>
    </div>

    <div class="stack-list notification-feed">
        <article th:each="n : ${notifications}" class="inline-card notification-card"
                 th:classappend="${!n.isRead ? ' notification-unread' : ''}">
            <div class="notification-body">
                <div class="notification-meta">
                    <span th:switch="${n.type}" class="notification-icon">
                        <i th:case="'BORROW_APPROVED'" class="fa-solid fa-circle-check notification-tone-success"></i>
                        <i th:case="'BORROW_REJECTED'" class="fa-solid fa-circle-xmark notification-tone-danger"></i>
                        <i th:case="'BORROW_RETURNED'" class="fa-solid fa-arrow-rotate-left notification-tone-info"></i>
                        <i th:case="'FINE_CREATED'" class="fa-solid fa-gavel notification-tone-warning"></i>
                        <i th:case="'FINE_PAID'" class="fa-solid fa-money-bill-wave notification-tone-success"></i>
                        <i th:case="'ORDER_DELIVERED'" class="fa-solid fa-truck notification-tone-teal"></i>
                        <i th:case="'ORDER_CANCELLED'" class="fa-solid fa-ban notification-tone-danger"></i>
                        <i th:case="*" class="fa-solid fa-bell notification-tone-default"></i>
                    </span>
                    <strong th:text="${n.title}">Tiêu đề</strong>
                    <span th:if="${!n.isRead}" class="status-pill danger notification-new-badge">Mới</span>
                </div>
                <p th:text="${n.message}" class="muted-text notification-message">Nội dung thông báo</p>
                <small class="muted-text" th:text="${#temporals.format(n.createdDate, 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</small>
            </div>
            <form th:if="${!n.isRead}" th:action="@{/notifications/{id}/read(id=${n.notificationId})}" method="post">
                <button type="submit" class="btn btn-ghost btn-sm" title="Đánh dấu đã đọc">
                    <i class="fa-solid fa-check"></i>
                </button>
            </form>
        </article>
    </div>

    <div class="empty-state" th:if="${#lists.isEmpty(notifications)}">
        <i class="fa-solid fa-bell-slash"></i>
        <p>Bạn chưa có thông báo nào.</p>
    </div>
</section>
</body>
</html>
